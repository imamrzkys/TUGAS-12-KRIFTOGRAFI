<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#0d1f35"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Lock body -->
  <rect x="7" y="15" width="18" height="12" rx="2.5" fill="url(#lock)" opacity="0.9"/>
  <!-- Lock shackle -->
  <path d="M10 15V11a6 6 0 0 1 12 0v4" stroke="url(#lock)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Keyhole circle -->
  <circle cx="16" cy="20" r="2" fill="#0a1a2e"/>
  <!-- Keyhole notch -->
  <rect x="15.2" y="21" width="1.6" height="2.5" rx="0.8" fill="#0a1a2e"/>
</svg>